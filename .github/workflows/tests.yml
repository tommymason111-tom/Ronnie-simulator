# Runs the crash and regression tests (tests/) on every push: static checks, the room server under attack, VR
# regressions, hostile multiplayer messages, two real games playing together, every place and mode, and a chaos bot.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
# a newer push stops the older run still going (only the newest code matters; no pile of runs and emails)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Quick tests (static checks, server, VR, hostile messages)
        run: node run.mjs lint server vr netfuzz talk cutscene perf
      - name: Two games playing together
        run: node run.mjs mp
      - name: Every place and mode
        run: node run.mjs places session
      - name: Chaos bot (one seed per place)
        run: node run.mjs chaos
        env:
          SEEDS: 1
          STEPS: 400
  # the same game in Safari's engine (every iPhone and iPad) and Firefox: every place and mode, and the chaos bot
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Every place and mode (${{ matrix.browser }})
        run: xvfb-run -a node run.mjs places
        env:
          BROWSER: ${{ matrix.browser }}
          HEADED: ${{ matrix.browser == 'firefox' && '1' || '' }}
      - name: Chaos bot (${{ matrix.browser }})
        run: xvfb-run -a node run.mjs chaos
        env:
          BROWSER: ${{ matrix.browser }}
          HEADED: ${{ matrix.browser == 'firefox' && '1' || '' }}
          SEEDS: 1
          STEPS: 300
